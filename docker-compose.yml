services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:${OMNIROUTE_PORT:-20128}:20128"
    environment:
      - OMNIROUTE_MEMORY_MB=${OMNIROUTE_MEMORY_MB:-1024}
    volumes:
      - omniroute-data:/app/data

volumes:
  omniroute-data:
